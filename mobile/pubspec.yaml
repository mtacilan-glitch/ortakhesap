name: ortakhesap
description: Ortak Hesap - Paylaşımlı Harcama Takip Uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^14.0.0

  # HTTP & API
  dio: ^5.4.0

  # Charts
  fl_chart: ^0.68.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.5.3

  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0

  # Utils
  url_launcher: ^6.2.2
  intl: ^0.19.0
  uuid: ^4.2.2

  # Icons
  cupertino_icons: ^1.0.6
  icons_plus: ^5.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

